<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDUGRADE External OMR Camera</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:18px}
main{max-width:850px;margin:auto;background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:20px;box-shadow:0 12px 35px #17203314}
h1{font-size:23px;margin:0 0 8px}p{color:#667085;line-height:1.5}
video,canvas{width:100%;max-height:70vh;object-fit:contain;background:#111827;border-radius:12px;margin-top:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#315bea;color:white}
button.secondary{background:#fff;color:#27354a;border:1px solid #d7deea}
#status{padding:12px;border-radius:10px;background:#f8fafc;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>EDUGRADE OMR Camera</h1>
  <p>I-frame the complete A5 answer sheet with all four black corner markers visible. Press Capture when the page is clear. The photo will be returned to the EDUGRADE dashboard tab; the Upload Photo option in the dashboard is unchanged.</p>
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="preview" hidden></canvas>
  <div class="actions">
    <button id="start">Open Camera</button>
    <button id="capture">Capture & Return</button>
    <button id="again" class="secondary">Retake</button>
    <button id="close" class="secondary">Close</button>
  </div>
  <div id="status">Camera is not started.</div>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const assessmentId = params.get('assessmentId') || '';
let stream = null;
const video = document.getElementById('camera');
const canvas = document.getElementById('preview');
const statusBox = document.getElementById('status');
function status(text){statusBox.textContent=text;}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
async function startCamera(){
  try{
    stopCamera();
    if(!window.isSecureContext){throw new Error('This camera page must be opened from HTTPS.');}
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){throw new Error('This browser does not support camera access.');}
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;video.hidden=false;canvas.hidden=true;
    await video.play();
    status('Camera ready. Keep the full answer sheet inside the frame, then Capture & Return.');
  }catch(err){
    status('Camera unavailable: '+(err&&err.message?err.message:String(err))+' Check browser site permissions and use the HTTPS hosted page.');
  }
}
function capture(){
  if(!video.videoWidth){status('Open the camera first and wait for the preview.');return;}
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  canvas.hidden=false;video.hidden=true;
  const imageData=canvas.toDataURL('image/jpeg',0.92);
  if(!window.opener || window.opener.closed){status('EDUGRADE dashboard tab was not found. Reopen this camera from the dashboard.');return;}
  window.opener.postMessage({type:'EDUGRADE_OMR_CAPTURE',assessmentId:assessmentId,imageData:imageData},'*');
  stopCamera();
  status('Photo sent to EDUGRADE. Return to the dashboard to review detected answers.');
  setTimeout(()=>window.close(),700);
}
document.getElementById('start').addEventListener('click',startCamera);
document.getElementById('capture').addEventListener('click',capture);
document.getElementById('again').addEventListener('click',()=>{canvas.hidden=true;video.hidden=false;if(!stream)startCamera();else status('Retake the photo when the sheet is clear.');});
document.getElementById('close').addEventListener('click',()=>{stopCamera();window.close();});
window.addEventListener('beforeunload',stopCamera);
if(!window.opener)status('Open this page using the Open Camera button inside EDUGRADE, so the captured photo can return to the dashboard.');
</script>
</body>
</html>
